[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqa-monitoring"
version = "0.1.0"
description = "Observability API for the DQA pipeline: unified issue feed + dashboard queries over BigQuery"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-cloud-bigquery>=3.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.1",
    "httpx>=0.27.0",
    "ruff>=0.9.3",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
